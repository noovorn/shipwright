name: validate
on:
  push:
  pull_request:
jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate SKILL.md files
        run: python scripts/validate.py
      - name: Shellcheck installer
        run: shellcheck install.sh
      - name: Smoke-test installer
        run: |
          HOME="$RUNNER_TEMP/home" ./install.sh
          test -f "$RUNNER_TEMP/home/.claude/skills/systematic-debugging/SKILL.md"
          test -f "$RUNNER_TEMP/home/.codex/skills/code-review/SKILL.md"
  demo-graders:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/nextjs-before-after
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Shellcheck demo scripts
        run: shellcheck -x run.sh selftest.sh lib.sh
      - name: Graders fail the buggy app and pass the reference fixes
        run: ./selftest.sh
